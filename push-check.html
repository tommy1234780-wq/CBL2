<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#03101f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>推播裝置驗收｜CBL 第三屆</title>
  <link rel="manifest" href="push-check.webmanifest">
  <link rel="icon" href="assets/season3-main-logo.webp">
  <link rel="stylesheet" href="assets/season3-site.css">
  <link rel="stylesheet" href="assets/push-check.css">
</head>
<body>
  <main class="push-check">
    <a class="brand" href="index.html"><img src="assets/season3-main-logo.webp" width="84" height="84" alt="CBL 第三屆官方標誌"><span>CBL 第三屆<br>推播裝置驗收</span></a>
    <h1>確認這台裝置能收到通知</h1>
    <p>此頁僅登記驗收裝置，不會訂閱球隊、不會對其他人發送通知。</p>
    <ol>
      <li id="install-step">iPhone 請使用 iOS 16.4 以上，在 Safari 將「此驗收頁」加入主畫面，再開啟「CBL 推播驗收」。這不會取代原本的官網 App。</li>
      <li>按下登記並允許通知，將驗收代碼提供給聯盟管理人員。</li>
      <li>管理人員核對後才會發送一則測試；收到後點擊通知，應開啟官網賽程。</li>
    </ol>
    <label class="consent"><input type="checkbox" id="consent">我同意登記此裝置，並接收一則由管理人員核准的測試通知。</label>
    <button type="button" id="register" disabled>同意並登記驗收裝置</button>
    <p id="status" role="status" aria-live="polite">尚未登記。正式球隊通知不會因此開啟。</p>
    <section id="result" hidden aria-labelledby="code-label"><h2 id="code-label">裝置驗收代碼</h2><output id="code"></output><p>只需回報此代碼，不需提供密碼、登入連結或推播金鑰。登記有效 24 小時。</p></section>
    <a href="index.html">返回聯盟官網</a>
  </main>
  <script src="assets/pwa.js?v=20261126-push-v3"></script>
  <script src="assets/push-check.js?v=20261126-push"></script>
</body>
</html>
